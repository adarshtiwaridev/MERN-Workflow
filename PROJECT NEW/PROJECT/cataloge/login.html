<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Rhythm Dance Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffeaa7;
            text-align: center;
            margin-top: 100px;
        }
        form {
            background-color: #dfe6e9;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }
        input {
            display: block;
            margin: 15px auto;
            padding: 10px;
            width: 250px;
            border: 1px solid #b2bec3;
            border-radius: 5px;
        }
        button {
            padding: 10px 30px;
            background-color: #d63031;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Login</h1>
    <form action="#">
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

</body>
</html>

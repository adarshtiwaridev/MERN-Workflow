<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classes - Rhythm Dance Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fab1a0;
            text-align: center;
            margin-top: 40px;
        }
        .catalogue {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 50px;
        }
        .class-card {
            background-color: white;
            width: 250px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.3);
        }
        img {
            width: 100%;
            border-radius: 10px;
        }
        h3 {
            color: #2d3436;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Our Dance Classes</h1>

    <div class="catalogue">
        <div class="class-card">
            <img src="https://images.unsplash.com/photo-1589571894960-20bbe2828d0" alt="Hip Hop">
            <h3>Hip Hop</h3>
            <p>Energy packed moves to pop beats!</p>
        </div>

        <div class="class-card">
            <img src="https://images.unsplash.com/photo-1526040652367-ac003a0475fe" alt="Ballet">
            <h3>Ballet</h3>
            <p>Graceful and elegant traditional dance.</p>
        </div>

        <div class="class-card">
            <img src="https://images.unsplash.com/photo-1573164574393-0dfce8d11351" alt="Salsa">
            <h3>Salsa</h3>
            <p>Learn the art of Latin dancing.</p>
        </div>
    </div>

</body>
</html>
